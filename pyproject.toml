[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-doctor"
version = "0.1.0"
description = "给你的 GitHub 仓库做发布体检：缺什么、值多少分、怎么补"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xingaorpw" }]
keywords = ["github", "linter", "open-source", "cli", "readme", "developer-tools"]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = []

[project.scripts]
repo-doctor = "repo_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/xingaorpw/repo-doctor"

[tool.setuptools.packages.find]
include = ["repo_doctor*"]
